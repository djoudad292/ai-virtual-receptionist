name: Keep Render backend awake

on:
  schedule:
    # Run every 10 minutes so the free-tier backend never idles out
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS -o /dev/null -w "health %{http_code}\n" \
            https://ai-receptionist-backend-h14q.onrender.com/api/health || echo "health ping failed"
      - name: Ping widget endpoint
        run: |
          curl -fsS -o /dev/null -w "widget %{http_code}\n" \
            https://ai-receptionist-backend-h14q.onrender.com/widget.js || echo "widget ping failed"
