name: Netlify Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'netlify.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://ai-receptionist-backend-h14q.onrender.com
          NEXT_PUBLIC_WS_URL: wss://ai-receptionist-backend-h14q.onrender.com
          NEXT_PUBLIC_WIDGET_URL: https://ai-receptionist-backend-h14q.onrender.com
        run: |
          npm ci
          npm run build

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.1.0 deploy --prod --dir frontend/out --site ${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
