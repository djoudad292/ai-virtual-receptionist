name: Android APK (direct)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build Android APK
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --local

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-receptionist-apk
          path: mobile/build/*.apk

      - name: Publish APK to GitHub Release
        run: |
          ASSET_NAME="ai-receptionist-$(date +%Y%m%d%H%M%S).apk"
          LATEST_APK=$(ls -t mobile/build/*.apk | head -1)
          cp "$LATEST_APK" "$ASSET_NAME"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk-receptionist
          name: Latest AI Receptionist Android APK
          body: |
            Latest Android APK built from main.
            Requires Android 8.0+
          files: "$ASSET_NAME"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}